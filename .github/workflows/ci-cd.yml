name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  # Lint and Format Check
  lint:
    runs-on: ubuntu-latest
    name: Lint & Format
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'yarn'

      - run: yarn install --frozen-lockfile

      - name: Lint code
        run: yarn lint

      - name: Check formatting
        run: yarn format --check

  # Type checking
  type-check:
    runs-on: ubuntu-latest
    name: Type Check
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'yarn'

      - run: yarn install --frozen-lockfile

      - name: Type check
        run: yarn type-check

  # Tests
  test:
    runs-on: ubuntu-latest
    name: Unit & Integration Tests
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'yarn'

      - run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test

      - name: Generate coverage
        run: yarn workspace @claudepp/backend test:cov || true

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: always()

  # Build verification
  build:
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    name: Build Verification
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'yarn'

      - run: yarn install --frozen-lockfile

      - name: Build all packages
        run: yarn build

  # Docker build (on main branch)
  docker-build:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    name: Docker Build
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build backend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: packages/backend/Dockerfile
          push: false
          tags: claudepp-backend:latest

      - name: Build web image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: packages/web/Dockerfile
          push: false
          tags: claudepp-web:latest

  # Security scanning
  security:
    runs-on: ubuntu-latest
    name: Security Scan
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'yarn'

      - run: yarn install --frozen-lockfile

      - name: Run npm audit
        run: yarn audit --level moderate || true

      - name: Dependency check
        uses: dependency-check/Dependency-Check_Action@main
        id: dependency-check
        with:
          path: '.'
          format: 'JSON'
          args: >
            --enable-retired
        continue-on-error: true

  # Code quality
  quality:
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    name: Code Quality
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'yarn'

      - run: yarn install --frozen-lockfile

      - name: Analyze with SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

  # Deploy to staging (on develop branch)
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, build]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    name: Deploy to Staging
    steps:
      - uses: actions/checkout@v3

      - name: Deploy backend to staging
        run: echo "Deploying backend to staging..."
        # Add your staging deployment commands here

      - name: Deploy web to staging
        run: echo "Deploying web to staging..."
        # Add your staging deployment commands here

  # Deploy to production (on main branch)
  deploy-production:
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, build, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    name: Deploy to Production
    environment: production
    steps:
      - uses: actions/checkout@v3

      - name: Deploy backend to production
        run: echo "Deploying backend to production..."
        # Add your production deployment commands here

      - name: Deploy web to production
        run: echo "Deploying web to production..."
        # Add your production deployment commands here

      - name: Health check
        run: |
          sleep 10
          curl -f http://localhost:3000/health || exit 1
        timeout-minutes: 2
        continue-on-error: true

      - name: Notify deployment
        if: success()
        run: echo "Deployment to production successful!"

  # Summary
  summary:
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, build]
    if: always()
    name: Workflow Summary
    steps:
      - name: Check workflow status
        run: |
          echo "Workflow Status Summary:"
          echo "- Lint: ${{ needs.lint.result }}"
          echo "- Type Check: ${{ needs.type-check.result }}"
          echo "- Tests: ${{ needs.test.result }}"
          echo "- Build: ${{ needs.build.result }}"

          if [ "${{ needs.lint.result }}" = "failure" ] || \
             [ "${{ needs.type-check.result }}" = "failure" ] || \
             [ "${{ needs.test.result }}" = "failure" ] || \
             [ "${{ needs.build.result }}" = "failure" ]; then
            exit 1
          fi
